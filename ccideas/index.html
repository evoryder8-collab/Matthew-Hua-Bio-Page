<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f4ece6" />
    <title>CB Content Ideas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23a87414'/%3E%3Cpath d='M5 16s4-7 11-7 11 7 11 7-4 7-11 7S5 16 5 16z' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23fff'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: light dark; --bg: #f4ece6; --fg: #1b1714; }
      @media (prefers-color-scheme: dark) { :root { --bg: #14110f; --fg: #f4ece6; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
      iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
      .fallback { position: fixed; inset: auto 16px 16px; font: 600 14px/1.4 system-ui, sans-serif; text-align: center; }
      .fallback a { color: inherit; }
    </style>
  </head>
  <body>
    <!-- Constantin Barbu's viral content hub, hosted on GitHub Pages (evoryder8-collab/cb-viral-content-hub).
         This page only frames it at matthewhua.ch/ccideas; nothing from Matthew's site is loaded here. -->
    <iframe id="hub" title="CB Viral Content Hub" src="https://evoryder8-collab.github.io/cb-viral-content-hub/"
      allow="clipboard-write; autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
    <noscript><p class="fallback"><a href="https://evoryder8-collab.github.io/cb-viral-content-hub/">Open the CB Viral Content Hub</a></p></noscript>
    <script>
      (function () {
        var HUB = 'https://evoryder8-collab.github.io/cb-viral-content-hub/';
        var ORIGIN = 'https://evoryder8-collab.github.io';
        var SAFE = /^#[\w-]{1,120}$/;
        var frame = document.getElementById('hub');
        // matthewhua.ch/ccideas#favourites opens the hub on that section.
        if (SAFE.test(location.hash)) frame.src = HUB + location.hash;
        window.addEventListener('hashchange', function () {
          if (SAFE.test(location.hash)) frame.src = HUB + location.hash;
        });
        // The hub reports where it is, so the address bar here stays shareable.
        window.addEventListener('message', function (e) {
          if (e.origin !== ORIGIN || !e.data || typeof e.data.ccHash !== 'string') return;
          var h = e.data.ccHash;
          if ((h === '' || SAFE.test(h)) && h !== location.hash) {
            try { history.replaceState(null, '', h || location.pathname); } catch (err) { /* ignore */ }
          }
        });
      })();
    </script>
  </body>
</html>
